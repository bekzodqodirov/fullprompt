name: calls-apk

# Built here because the app is handed out from the admin screen (no store):
# every push that touches it produces a downloadable artifact.
on:
  push:
    paths:
      - 'apps/calls-android/**'
      - '.github/workflows/calls-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/calls-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-calls-${{ hashFiles('apps/calls-android/**/*.gradle.kts', 'apps/calls-android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build APK
        env:
          # Stamped into the app so the screen can say which build it is.
          GSR_BUILD_ID: ${{ github.sha }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/GSRCalls-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GSRCalls-apk
          path: apps/calls-android/out/*.apk
          retention-days: 30
