name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # A green run takes ~35 minutes. Without a ceiling, one hung step holds
    # the job until GitHub's six-hour kill: the browser download below once
    # sat 3h45m doing nothing, and the PR showed a red X that had nothing to
    # say about the code.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: gsr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/gsr_test
      SESSION_SECRET: ci-secret
      STORAGE_DRIVER: local
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Integration tests hit the database — migrate first. Seed before
      # vitest too, so tests may rely on seed data without a local/CI split
      # (seed is idempotent).
      - run: pnpm db:migrate
      - run: pnpm db:seed
      # Demo warehouses, staff and the canonical receipt — a SEPARATE script
      # since round 83, because `db:seed` runs on every production deploy and
      # a flag inside it was one wrong condition away from putting demo data
      # into the live company. The browser suite signs in as these accounts.
      - run: pnpm db:seed:demo
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright chromium
        # Its own short leash + bounded retries. The old `a || a` retry was
        # unreachable: `timeout-minutes` kills the STEP, so one hung attempt
        # ate the whole leash before the second could run — proven 2026-08-19
        # when archive.ubuntu.com stalled `--with-deps`'s apt round twice in a
        # row. Each attempt is now bounded so the next one is reachable, and
        # the last skips apt entirely: the hosted runner image already carries
        # Chromium's system libraries, so a dead ubuntu mirror must not fail
        # the run while the browser CDN is fine.
        timeout-minutes: 10
        run: >-
          timeout 240 pnpm exec playwright install --with-deps chromium ||
          timeout 240 pnpm exec playwright install --with-deps chromium ||
          pnpm exec playwright install chromium
      - name: E2E smoke (mobile viewport)
        run: CI=1 pnpm e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
